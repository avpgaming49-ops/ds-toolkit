[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rage-tools"
version = "0.1.1" 
description = "RAGE Data Science & ML Toolkit for fast cleaning, EDA, preprocessing, and evaluation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]